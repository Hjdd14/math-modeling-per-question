name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile tools
        run: python -m compileall tools

      - name: Run doctor
        run: python tools/doctor.py --workspace .

      - name: Run pytest
        run: python -m pytest tests -q

      - name: Run test orchestrator
        run: python tests/run_all_tests.py

      - name: Verify fixture workspace
        run: python tools/pipeline_check.py --workspace tests/test_data --language python

      - name: Verify per-question stage mode
        run: python tools/pipeline_check.py --workspace tests/test_data --language python --stage question

      - name: Verify question queue tool
        run: |
          python tools/question_queue.py init --workspace ci_queue_demo --questions q1,q2,q3 --depends "q3:q1"
          python tools/question_queue.py next --workspace ci_queue_demo
          python tools/question_queue.py complete --workspace ci_queue_demo --question q1 --score 80
          python tools/question_queue.py status --workspace ci_queue_demo

      - name: Verify per-question scaffold
        run: python tools/workflow_runner.py scaffold --workspace ci_scaffold_demo --language python --questions q1,q2

      - name: Verify excellence fixture workspace
        run: python tools/pipeline_check.py --workspace tests/test_data --language python --evidence-mode strict --quality-mode excellence

      - name: Verify source registry
        run: python tools/source_registry_checker.py --skill-root . --mode excellence

      - name: Verify source freshness offline
        run: python tools/source_freshness_checker.py --workspace . --mode excellence

      - name: Verify award readiness artifacts
        run: python tools/award_readiness_checker.py --workspace tests/test_data --mode excellence

      - name: Verify mini benchmark structure
        run: python tools/mini_benchmark_checker.py --benchmark evals/mini_contest_benchmark.json --mode strict

      - name: Run mini benchmark
        run: python tools/mini_benchmark_runner.py --benchmark evals/mini_contest_benchmark.json --mode strict

      - name: Check workflow JavaScript
        shell: pwsh
        run: Get-ChildItem workflows -Filter *.js | ForEach-Object { node --check $_.FullName }

      - name: Resume fixture workspace
        run: python tools/workflow_runner.py resume --workspace tests/test_data --language python
